<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebratests - Game Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        .container {
            text-align: center;
            width: 95%;
            max-width: 1024px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .frame-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Perfect 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #27272a;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 10px 10px -5px rgba(0, 0, 0, 0.7);
            background: #000000;
        }
        .frame-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bullet Force Multiplayer</h1>
    <div class="frame-wrapper">
        <iframe 
            src="https://bitbucket.io" 
            allow="autoplay; gamepad; fullscreen; keyboard; pointer-lock"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts allow-same-origin"
            allowfullscreen>
        </iframe>
    </div>
</div>

</body>
</html>
